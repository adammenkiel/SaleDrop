services:
    db:
        image: postgres:18
        container_name: postgres_db
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: saledrop
        ports:
            - "5432:5432"
        volumes:
            - pgdata:/var/lib/postgresql
            - ./Database/init.sql:/docker-entrypoint-initdb.d/init.sql
    backend:
        build: ./Backend
        container_name: saledrop_backend
        ports:
            - "3000:3000"
        depends_on:
            - db
        environment:
            DB_HOST: db
            DB_USER: postgres
            DB_PASS: postgres
            DB_NAME: saledrop
            DB_PORT: 5432
            JWT_SECRET: supersecret
volumes:
    pgdata: